name: backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build

  slot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Revalidação de horário e do agente
        run: deno test supabase/functions/_shared/slot_test.ts supabase/functions/_shared/agent_test.ts supabase/functions/_shared/square_test.ts
